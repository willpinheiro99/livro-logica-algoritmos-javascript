<!-- Elaborar um programa para uma pizzaria, o qual leia o valor total de uma conta e quantos clientes vão pagá-la. Calcule e informe o valor a ser pago por cliente. -->

<script>
    const valor = Number(prompt("Valor total da conta:").replace(",","."))
    const clientes = Number(prompt("Quantidade de clientes:"))

    
    alert(`O total a pagar por cada pessoa é: R$ ${(valor / clientes).toFixed(2)}`)
</script>
