<!-- Elaborar um programa que leia 2 notas de um aluno em uma disciplina. Calcule e informe a média das notas. -->

<script>
    const aluno = prompt("Aluno, qual é o seu nome?");

    const nota1 = Number(prompt(`${aluno}, sua primeira nota é:`));
    const nota2 = Number(prompt(`${aluno}, sua segunda nota é:`));

    const media = (nota1 + nota2) / 2;

    alert(`${aluno}, sua média é: ${media}`);

</script>
